[package]
name = "nexplore"
version = "1.0.0-rc.1"
edition = "2024"
authors = ["Garry O'Donnell <garry.euan.odonnell@ntlworld.com>", "Pete Peterson <petersonpf@ornl.gov>"]
description = "A Terminal User Interface (TUI) for exploring hdf5 & NeXus files"
license = "MIT"
keywords = ["hdf5", "nexus", "tui"]
categories = ["command-line-utilities", "science", "visualization"]
repository = "https://github.com/peterfpeterson/nexplore"

[dependencies]
anyhow = { version = "1.0.104" }
clap = { version = "4.6.4", features = ["derive"] }
crossterm = { version = "0.29.0" }
hdf5 = { version = "0.14.0", package = "hdf5-metno" }
hdf5-sys = { version = "0.12.1", package = "hdf5-metno-sys", features = ["static"] }
humansize = { version = "2.1.3" }
ratatui = { version = "0.30.2" }
regex = { version = "1.13.1" }
